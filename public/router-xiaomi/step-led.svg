<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 140" width="220" height="140">
  <defs>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#22c55e" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#22c55e" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- arrow pointing at the indicator strip on the router -->
  <path d="M6 70 40 44v15h44v22H40v15z" fill="#e20074"/>
  <!-- indicator strip, as printed on the router's front: 5G, 4G, Wi-Fi, SYSTEM -->
  <rect x="104" y="8" width="104" height="124" rx="14" fill="none" stroke="#bdbdbd" stroke-width="2"/>
  <g font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#6b6b6b">
    <circle cx="128" cy="34" r="16" fill="url(#glow)"/>
    <circle cx="128" cy="34" r="7" fill="#ffffff" stroke="#22c55e" stroke-width="2.5"/>
    <text x="146" y="39">5G</text>
    <circle cx="128" cy="58" r="7" fill="#f2f2f2" stroke="#bdbdbd" stroke-width="2"/>
    <text x="146" y="63" fill="#a3a3a3">4G</text>
    <circle cx="128" cy="82" r="16" fill="url(#glow)"/>
    <circle cx="128" cy="82" r="7" fill="#ffffff" stroke="#22c55e" stroke-width="2.5"/>
    <text x="146" y="87">Wi-Fi</text>
    <circle cx="128" cy="106" r="16" fill="url(#glow)"/>
    <circle cx="128" cy="106" r="7" fill="#ffffff" stroke="#22c55e" stroke-width="2.5"/>
    <text x="146" y="111" font-size="11">SYSTEM</text>
  </g>
</svg>
